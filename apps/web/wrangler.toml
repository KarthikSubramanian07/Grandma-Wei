# Cloudflare Pages project. Deploy with `bun run deploy` (scripts/deploy.sh).
# Her eyes: set GROQ_API_KEY (or ANTHROPIC_API_KEY) as a Pages secret.
name = "grandma-wei"
pages_build_output_dir = "dist"
compatibility_date = "2026-10-13"
compatibility_flags = ["nodejs_compat"]

[vars]
VISION_MODEL = "claude-opus-5-5"
VOICE_MODEL = "claude-opus-5-5"
GROQ_VISION_MODEL = "qwen/qwen3.8-27b"
GROQ_VOICE_MODEL = "qwen/qwen3.8-27b"
VISION_EFFORT = "medium"
VOICE_EFFORT = "low"
READS_PER_HOUR = "12"
READS_PER_DAY = "400"

# Shares (text only) and rate-limit counters. D1 also works: bind it as DB
# (see migrations/) and it takes precedence over KV.
[[kv_namespaces]]
binding = "KV"
id = "0aad5fb329ee48b79e43ca1b58ab70e6"
