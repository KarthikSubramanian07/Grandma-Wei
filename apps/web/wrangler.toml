# Cloudflare Pages project. Deploys from CI: see .github/workflows/deploy.yml.
name = "grandma-wei"
pages_build_output_dir = "dist"
compatibility_date = "2026-10-13"
compatibility_flags = ["nodejs_compat"]

[vars]
VISION_MODEL = "claude-opus-5-5"
VOICE_MODEL = "claude-opus-5-5"
VISION_EFFORT = "medium"
VOICE_EFFORT = "low"
READS_PER_HOUR = "12"
READS_PER_DAY = "400"

# Shares (text only) and rate-limit counters. D1 also works: bind it as DB
# (see migrations/) and it takes precedence over KV.
[[kv_namespaces]]
binding = "KV"
id = "0aad5fb329ee48b79e43ca1b58ab70e6"
