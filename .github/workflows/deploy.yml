name: Deploy

# Ships main to Cloudflare Pages at grandma-wei.pages.dev.
# Needs repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
# ANTHROPIC_API_KEY turns on real photo readings; without it, the site runs
# with practice rooms only. SIGNING_SECRET, if set here, replaces the one
# already stored on the Pages project. Storage is the KV namespace in
# apps/web/wrangler.toml.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: grandma-wei
    steps:
      - name: Check for Cloudflare credentials
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Skipping deploy: add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to ship."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.creds.outputs.ok == 'true'
      - uses: dtolnay/rust-toolchain@stable
        if: steps.creds.outputs.ok == 'true'
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        if: steps.creds.outputs.ok == 'true'
        with:
          workspaces: crates/qi
      - uses: taiki-e/install-action@v2
        if: steps.creds.outputs.ok == 'true'
        with:
          tool: wasm-pack
      - uses: oven-sh/setup-bun@v2
        if: steps.creds.outputs.ok == 'true'
      - name: Build
        if: steps.creds.outputs.ok == 'true'
        run: |
          bun install --frozen-lockfile
          bun run qi
          bun run --cwd apps/web build
      - name: Create the Pages project if it doesn't exist
        if: steps.creds.outputs.ok == 'true'
        working-directory: apps/web
        run: |
          W=./node_modules/.bin/wrangler
          $W pages project list | grep -q " $PROJECT " || $W pages project create "$PROJECT" --production-branch main
      - name: Set secrets
        if: steps.creds.outputs.ok == 'true'
        working-directory: apps/web
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}
        run: |
          W=./node_modules/.bin/wrangler
          if [ -n "$ANTHROPIC_API_KEY" ]; then printf '%s' "$ANTHROPIC_API_KEY" | $W pages secret put ANTHROPIC_API_KEY --project-name "$PROJECT"; else echo "::notice::No ANTHROPIC_API_KEY: practice rooms only."; fi
          if [ -n "$SIGNING_SECRET" ]; then printf '%s' "$SIGNING_SECRET" | $W pages secret put SIGNING_SECRET --project-name "$PROJECT"; fi
      - name: Deploy
        if: steps.creds.outputs.ok == 'true'
        working-directory: apps/web
        run: ./node_modules/.bin/wrangler pages deploy dist --project-name "$PROJECT" --branch main --commit-dirty=true
      - name: Smoke test
        if: steps.creds.outputs.ok == 'true'
        run: |
          sleep 15
          curl -fsS "https://$PROJECT.pages.dev/api/health"
          curl -fsS "https://$PROJECT.pages.dev/api/sample/traveler" | jq -e '.result.reading.score == 49'
