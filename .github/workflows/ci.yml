name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: crates/qi
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2
        with:
          tool: wasm-pack
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Rules engine tests
        run: cd crates/qi && cargo test --quiet
      - name: Clippy
        run: cd crates/qi && cargo clippy --all-targets -- -D warnings
      - name: Install
        run: bun install --frozen-lockfile
      - name: Build qi to WebAssembly
        run: bun run qi
      - name: TypeScript tests
        run: bun test packages
      - name: Typecheck
        run: bun run typecheck

  web:
    name: Build and end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: crates/qi
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2
        with:
          tool: wasm-pack
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Install
        run: bun install --frozen-lockfile
      - name: Build qi to WebAssembly
        run: bun run qi
      - name: Typecheck the web app
        run: cd apps/web && ../../node_modules/.bin/tsc -p tsconfig.json
      - name: Build the site
        run: bun run --cwd apps/web build
      - name: Install Chromium
        run: cd apps/web && ./node_modules/.bin/playwright install --with-deps chromium
      - name: End-to-end tests
        run: cd apps/web && ./node_modules/.bin/playwright test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-traces
          path: apps/web/test-results
          retention-days: 7
