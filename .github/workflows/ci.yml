name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/qi
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: oven-sh/setup-bun@v2
      - name: Rules engine tests
        run: cd crates/qi && cargo test --quiet
      - name: Clippy
        run: cd crates/qi && cargo clippy --all-targets -- -D warnings
      - name: Install
        run: bun install --frozen-lockfile
      - name: Build qi to WebAssembly
        run: bun run qi
      - name: TypeScript tests
        run: bun test packages
      - name: Typecheck
        run: bun run typecheck
